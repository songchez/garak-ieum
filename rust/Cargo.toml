[workspace]
resolver = "3"
members = ["garak-dsp", "garak-engine", "garak-engine-wasm", "garak-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
garak-dsp = { path = "garak-dsp" }
garak-engine = { path = "garak-engine" }
# Pure-Rust libm for wasm32 (no C library there). Native garak-ffi uses the platform libm instead
# (garak-dsp feature `platform-math`, src/math.rs). `arch`: exact hardware ops (sqrt, fma) where
# libm has them; on Apple arm64 `fma` is the fmadd that mirrors AppleClang's FP contraction.
libm = { version = "0.2", default-features = false, features = ["arch"] }

# Real-time rules (docs/RUST.md). Each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# No panics on the audio thread: every construct that can panic is a hard error.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Allocation is structurally impossible in garak-dsp (#![no_std], no `alloc` crate).
std_instead_of_core = "warn"
float_cmp = "allow"
many_single_char_names = "allow"
too_many_arguments = "allow"
excessive_precision = "allow"

# Fast edit/test loop: incremental, light debug info, and the DSP crate at -O1 so tests that
# push seconds of audio through filters stay quick.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
panic = "abort"

[profile.dev.package.garak-dsp]
opt-level = 1

[profile.dev.package.libm]
opt-level = 1

# Native staticlib (linked into C++) and the default for `pnpm rust:build`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
incremental = false

# Base of the browser engine module's profile below: full LTO + strip keep it small.
[profile.wasm]
inherits = "release"
lto = "fat"
strip = true

# The render engine for the web worklet (garak-engine-wasm, `pnpm rust:wasm`; docs/RUST_ENGINE.md 5).
# Measured on the 16/32-track benchmark (src/audio/rust/engineAB.test.ts): the engine's own code
# (JSON/protocol, graph preparation, clip/track loops) renders no slower at "s" than at 3, while the
# garak-dsp kernels lose ~20 % at "s"; so "s" everywhere except garak-dsp: 258 KiB instead of 282 KiB
# (gzip 105 KB / 113 KB), same CPU. "z" saves 6 KiB more and costs ~20 %. A no_std build with an
# explicit dlmalloc was 3.7 KiB larger than std's allocator.
[profile.wasm-engine]
inherits = "wasm"
opt-level = "s"

[profile.wasm-engine.package.garak-dsp]
opt-level = 3
