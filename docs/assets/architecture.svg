<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Garak Ieum core architecture</title>
  <desc id="arch-desc">The React UI and the local MCP server both edit the project through ProjectSession and validated commands in src/core, which also autosaves to IndexedDB and .garak files. Offline Web Workers render pitch-edited and warped audio back into the project. The audio engine interface picks WebAudioEngine (AudioContext and AudioWorklet) in the browser, or NativeAudioEngine in the Electron desktop app, which drives the separate C++20 garak-audio-host process over IPC. The native host plays instruments, effects, the guitar rig and VST3 plug-ins through ASIO, WASAPI or Core Audio. Device and instrument definitions in src/devices are shared by both engines.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5B6168"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8A6D2F"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1F2328; }
      .h { font-size: 16px; font-weight: 700; }
      .s { font-size: 13px; fill: #4A5058; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #6A7078; }
      .t { font-size: 22px; font-weight: 700; }
      .lg { font-size: 12.5px; fill: #4A5058; }
      .box { fill: #FFFFFF; stroke-width: 1.6; }
      .core { stroke: #3D7865; }
      .web { stroke: #285973; }
      .desk { stroke: #DF5435; }
      .shared { stroke: #8A6D2F; }
      .bar-core { fill: #3D7865; }
      .bar-web { fill: #285973; }
      .bar-desk { fill: #DF5435; }
      .bar-shared { fill: #8A6D2F; }
      .flow { fill: none; stroke: #5B6168; stroke-width: 1.6; }
      .dash { fill: none; stroke: #8A6D2F; stroke-width: 1.6; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- card background: keeps contrast on light and dark GitHub themes -->
  <rect x="0.5" y="0.5" width="999" height="779" rx="20" fill="#F8F6F0" stroke="#DDD7CB"/>
  <text class="t" x="40" y="50">Garak Ieum · core architecture</text>

  <!-- Row A -->
  <rect class="box core" x="40" y="80" width="560" height="72" rx="10"/>
  <rect class="bar-core" x="40" y="80" width="6" height="72" rx="3"/>
  <text class="h" x="62" y="108">React UI</text>
  <text class="code" x="140" y="108">src/components</text>
  <text class="s" x="62" y="132">Timeline · piano roll · mixer · device and pitch editors</text>

  <rect class="box core" x="660" y="80" width="300" height="72" rx="10"/>
  <rect class="bar-core" x="660" y="80" width="6" height="72" rx="3"/>
  <text class="h" x="682" y="108">MCP server</text>
  <text class="code" x="776" y="108">mcp/</text>
  <text class="s" x="682" y="132">Local stdio tools for AI clients</text>

  <!-- Row B -->
  <rect class="box core" x="40" y="196" width="560" height="72" rx="10"/>
  <rect class="bar-core" x="40" y="196" width="6" height="72" rx="3"/>
  <text class="h" x="62" y="224">ProjectSession + commands</text>
  <text class="code" x="282" y="224">src/core</text>
  <text class="s" x="62" y="248">Serializable project model · validated edits · undo/redo</text>

  <rect class="box core" x="660" y="196" width="300" height="72" rx="10"/>
  <rect class="bar-core" x="660" y="196" width="6" height="72" rx="3"/>
  <text class="h" x="682" y="224">Project storage</text>
  <text class="s" x="682" y="248">IndexedDB autosave · .garak files</text>

  <!-- Row C -->
  <rect class="box core" x="40" y="312" width="560" height="72" rx="10"/>
  <rect class="bar-core" x="40" y="312" width="6" height="72" rx="3"/>
  <text class="h" x="62" y="340">Audio engine interface</text>
  <text class="code" x="248" y="340">src/audio</text>
  <text class="s" x="62" y="364">engineFactory picks one backend for the current runtime</text>

  <rect class="box shared" x="660" y="312" width="300" height="72" rx="10"/>
  <rect class="bar-shared" x="660" y="312" width="6" height="72" rx="3"/>
  <text class="h" x="682" y="340">Offline workers</text>
  <text class="s" x="682" y="364">Pitch editing · audio warp → new PCM</text>

  <!-- Row D -->
  <rect class="box web" x="40" y="428" width="260" height="72" rx="10"/>
  <rect class="bar-web" x="40" y="428" width="6" height="72" rx="3"/>
  <text class="h" x="62" y="456">Browser · WebAudioEngine</text>
  <text class="s" x="62" y="480">AudioContext · AudioWorklet</text>

  <rect class="box desk" x="340" y="428" width="260" height="72" rx="10"/>
  <rect class="bar-desk" x="340" y="428" width="6" height="72" rx="3"/>
  <text class="h" x="362" y="456">Desktop · NativeAudioEngine</text>
  <text class="s" x="362" y="480">Electron IPC bridge · <tspan class="code">desktop/</tspan></text>

  <!-- Row E -->
  <rect class="box shared" x="40" y="548" width="260" height="170" rx="10"/>
  <rect class="bar-shared" x="40" y="548" width="6" height="170" rx="3"/>
  <text class="h" x="62" y="576">Devices &amp; instruments</text>
  <text class="code" x="62" y="598">src/devices</text>
  <text class="s" x="62" y="626">IEUM WAVE wavetable synth</text>
  <text class="s" x="62" y="648">Guitar rig: amp, cab, pedals</text>
  <text class="s" x="62" y="670">6 effects, EQ to reverb</text>
  <text class="s" x="62" y="692">Synth &amp; sampled instruments</text>

  <rect class="box desk" x="340" y="548" width="260" height="170" rx="10"/>
  <rect class="bar-desk" x="340" y="548" width="6" height="170" rx="3"/>
  <text class="h" x="362" y="576">garak-audio-host</text>
  <text class="code" x="362" y="598">native/ · C++20 process</text>
  <text class="s" x="362" y="626">Sample-accurate timeline</text>
  <text class="s" x="362" y="648">Instruments, effects, mixer</text>
  <text class="s" x="362" y="670">Latency compensation</text>
  <text class="s" x="362" y="692">Recording · WAV export</text>

  <rect class="box desk" x="660" y="548" width="300" height="72" rx="10"/>
  <rect class="bar-desk" x="660" y="548" width="6" height="72" rx="3"/>
  <text class="h" x="682" y="576">Audio drivers</text>
  <text class="s" x="682" y="600">ASIO · WASAPI · Core Audio</text>

  <rect class="box desk" x="660" y="646" width="300" height="72" rx="10"/>
  <rect class="bar-desk" x="660" y="646" width="6" height="72" rx="3"/>
  <text class="h" x="682" y="674">VST3 plug-ins</text>
  <text class="s" x="682" y="698">Hosted with native editor windows</text>

  <!-- Flows -->
  <path class="flow" d="M320 152V192" marker-end="url(#arrow)"/>
  <path class="flow" d="M660 116H630V212H604" marker-end="url(#arrow)"/>
  <path class="flow" d="M604 244H656" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="flow" d="M660 348H630V256H604" marker-end="url(#arrow)"/>
  <path class="flow" d="M320 268V308" marker-end="url(#arrow)"/>
  <text class="lg" x="330" y="294">project snapshot</text>
  <path class="flow" d="M320 384V406H170V424" marker-end="url(#arrow)"/>
  <path class="flow" d="M320 406H470V424" marker-end="url(#arrow)"/>
  <path class="flow" d="M470 500V544" marker-end="url(#arrow)"/>
  <text class="lg" x="480" y="527">validated IPC</text>
  <path class="flow" d="M604 584H656" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="flow" d="M604 682H656" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="dash" d="M170 548V504" marker-end="url(#arrow-dash)"/>
  <path class="dash" d="M300 633H336" marker-end="url(#arrow-dash)"/>

  <!-- Legend -->
  <g transform="translate(40 752)">
    <rect class="bar-core" x="0" y="-11" width="14" height="14" rx="3"/>
    <text class="lg" x="22" y="1">Shared core</text>
    <rect class="bar-web" x="120" y="-11" width="14" height="14" rx="3"/>
    <text class="lg" x="142" y="1">Browser</text>
    <rect class="bar-desk" x="218" y="-11" width="14" height="14" rx="3"/>
    <text class="lg" x="240" y="1">Desktop (Electron + C++)</text>
    <rect class="bar-shared" x="420" y="-11" width="14" height="14" rx="3"/>
    <text class="lg" x="442" y="1">Shared by both engines</text>
    <path class="flow" d="M610 -4H646" marker-end="url(#arrow)"/>
    <text class="lg" x="656" y="1">control / data</text>
    <path class="dash" d="M770 -4H806" marker-end="url(#arrow-dash)"/>
    <text class="lg" x="816" y="1">shared definitions</text>
  </g>
</svg>
