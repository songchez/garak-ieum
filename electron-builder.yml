appId: com.garakieum.desktop
productName: 가락이음
directories:
  output: release
files:
  - dist/**
  - dist-desktop/**
  - dist-mcp/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - from: src/devices/pitch-editor/vendor
    to: dist/licenses
    filter:
      - LICENSE.signalsmith.txt
asar: true
# The Windows MCP console launcher uses this bundled Node runtime with inherited pipes.
electronFuses:
  runAsNode: true
npmRebuild: false
compression: normal
win:
  fileAssociations:
    - ext: garak
      name: GarakIeum.Project
      description: 가락이음 음악 프로젝트
      role: Editor
  extraFiles:
    - from: build/native/garak-mcp.exe
      to: garak-mcp.exe
  target:
    - target: nsis
      arch: [x64]
  icon: public/brand/garak-ieum-mark.png
  executableName: 가락이음
  artifactName: Garak-Ieum-Setup-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.music
  icon: public/brand/garak-ieum-mark.png
  artifactName: Garak-Ieum-Setup-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The build wrapper selects ad-hoc preview or verified Developer ID signing.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: 가락이음에서 마이크나 오디오 입력을 녹음하고 모니터링하기 위해 사용합니다. 녹음 파일은 이 Mac에 저장됩니다.
    CFBundleDocumentTypes:
      - CFBundleTypeName: 가락이음 음악 프로젝트
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        CFBundleTypeExtensions: [garak]
        CFBundleTypeIconFile: icon.icns
        LSItemContentTypes: [com.garakieum.project]
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.garakieum.project
        UTTypeDescription: 가락이음 음악 프로젝트
        UTTypeConformsTo: [public.json]
        UTTypeIconFile: icon.icns
        UTTypeTagSpecification:
          public.filename-extension: [garak]
          public.mime-type: application/x-garak-ieum-project
dmg:
  title: 가락이음 ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
