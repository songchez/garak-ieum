name: macOS desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_build:
        description: Preserve this exact release build while other commits run.
        type: boolean
        default: false
  # Full installer builds run for desktop, native and packaging changes, for every
  # release (workflow_call) and on demand. App-only PRs get the fast Checks workflow.
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
      - 'desktop/**'
      - 'native/**'
      - 'scripts/native-*.mjs'
      - 'scripts/build-native-audio.mjs'
      - 'scripts/desktop-*.mjs'
      - 'scripts/prepare-licenses.mjs'
      - 'scripts/source-info.mjs'
      - 'build/entitlements.mac.plist'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'mcp/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'electron-builder.*'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_build && github.run_id || 'validation' }}
  cancel-in-progress: ${{ !inputs.release_build }}

jobs:
  macos:
    name: macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: arm64
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Validation builds reuse the native host when native sources, its build scripts and CMake
      # are unchanged (most pushes only touch src/). Release builds always compile from scratch.
      - name: Restore unchanged native engine build
        if: ${{ !inputs.release_build }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/native-audio
            build/native-work
          key: native-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'scripts/build-native-audio.mjs', 'scripts/native-dependencies.mjs') }}

      - name: Build ad-hoc signed preview DMG
        env:
          GARAK_NATIVE_REUSE: ${{ inputs.release_build && '0' || '1' }}
        run: pnpm desktop:build:mac --arm64

      # A release build compiles the native host from scratch on main; keep that result so
      # pull requests (which can read main's caches) can reuse it.
      - name: Share the freshly built native host with later validation runs
        if: ${{ inputs.release_build }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/native-audio
            build/native-work
          key: native-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'scripts/build-native-audio.mjs', 'scripts/native-dependencies.mjs') }}

      - name: Verify native audio and actual VST3 host
        run: pnpm native:test

      - name: Install DMG and verify bundle metadata
        run: pnpm desktop:install:mac:test

      - name: Smoke-test installed desktop app
        run: pnpm desktop:test

      - name: Collect installed-app crash diagnostics
        if: ${{ failure() }}
        run: node scripts/desktop-macos-diagnostics.mjs

      - name: Upload desktop smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-ieum-macos-smoke-arm64-${{ github.sha }}
          path: release/desktop-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package matching project source
        run: pnpm desktop:source

      - name: Calculate DMG and source checksums
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFile, readdir, writeFile } from 'node:fs/promises'
          const { version } = JSON.parse(await readFile('package.json', 'utf8'))
          const sources = (await readdir('release')).filter(name => /^Garak-Ieum-Source-.*\.zip$/.test(name))
          assert.equal(sources.length, 1, 'Exactly one matching source archive is required.')
          const names = [`Garak-Ieum-Setup-${version}-arm64.dmg`, ...sources]
          const sums = await Promise.all(names.map(async name => `${createHash('sha256').update(await readFile(`release/${name}`)).digest('hex')}  ${name}`))
          await writeFile('release/SHA256SUMS-macos-arm64.txt', `${sums.join('\n')}\n`)
          NODE

      - name: Upload tested DMG and matching source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-ieum-macos-arm64-${{ github.sha }}
          path: |
            release/Garak-Ieum-Setup-*-arm64.dmg
            release/Garak-Ieum-Source-*.zip
            release/SOURCE.txt
            release/LICENSE.txt
            release/THIRD_PARTY_NOTICES.txt
            release/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
