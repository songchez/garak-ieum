name: Rust core

# The Rust DSP core (docs/RUST.md) and render engine (docs/RUST_ENGINE.md): lint, unit tests, the
# WASM modules (+ size report, the TypeScript parity test and the engine's WASM-vs-native test) on
# Linux, and the garak-ffi staticlib linked into the native engine and its golden-reference tests with
# the real CI toolchains (Windows MSVC, macOS arm64). Web-only and other native PRs never run this.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rust.yml'
      - 'rust/**'
      - 'native/CMakeLists.txt'
      - 'native/cmake/**'
      - 'native/tests/engine_test.cpp'
      - 'native/tests/eq_test.inc'
      - 'native/tests/golden.hpp'
      - 'native/tests/golden/**'
      - 'native/tests/rust_fx.hpp'
      - 'native/tests/rust_parity_test.cpp'
      - 'native/tests/rust_engine_parity_test.cpp'
      - 'native/tests/rust_engine_host_test.cpp'
      - 'native/tests/rust_engine_instrument_parity_test.cpp'
      - 'native/tests/rust_instrument_test.cpp'
      - 'native/src/rust_engine.inc'
      - 'native/src/engine.cpp'
      - 'native/src/protocol.hpp'
      - 'native/include/garak/engine.hpp'
      - 'native/include/garak/tempo.hpp'
      - 'native/src/host.cpp'
      - 'native/tests/wavetable_host_test.cpp'
      - 'native/tests/rust_wave_golden_test.cpp'
      - 'src/devices/wavetable-synth/**'
      - 'src/devices/vintage/**'
      - 'src/devices/guitar-rig/**'
      - 'src/audio/rust/**'
      - 'src/audio/native/timeline.ts'
      - 'src/audio/native/timelineSync.ts'
      - 'src/devices/effects/sigimsae.ts'
      - 'src/devices/effects/sigimsaeDefs.ts'
      - 'src/devices/effects/eqModel.ts'
      - 'scripts/rust.mjs'
      - 'scripts/setup-rust.*'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  core:
    name: Lint, test and WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same one-command setup contributors use; installs the toolchain pinned in
      # rust/rust-toolchain.toml (rustup is preinstalled on GitHub runners).
      - name: Install the pinned Rust toolchain
        run: sh scripts/setup-rust.sh --skip-verify

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy (host and wasm32, warnings are errors)
        working-directory: rust
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p garak-dsp -p garak-engine -p garak-engine-wasm --target wasm32-unknown-unknown -- -D warnings

      # Also writes the engine parity project and its native render to rust/target/engine-parity/.
      - name: Unit tests
        working-directory: rust
        run: cargo test --locked --workspace

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # garak-engine.wasm: the web's render engine (worklet and export worker, docs/RUST_ENGINE.md 5).
      # scripts/rust.mjs writes the size report to the step summary and fails above the budget.
      - name: Build the WASM engine module (fail above its size budget)
        run: node scripts/rust.mjs wasm

      - name: Upload the WASM engine module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-engine-wasm
          path: |
            public/wasm/garak-engine.wasm
          if-no-files-found: error
          retention-days: 14

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # The render engine (WASM vs the native Rust render), the web engine path A/B (Project -> timeline
      # compiler -> garak-engine.wasm vs the 0.3.2 mix semantics), every built-in effect through the module
      # and the web host paths.
      - name: TypeScript checks against the built WASM engine
        run: pnpm exec vitest run src/audio/rust

  native-parity:
    name: Rust engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-latest
            cmake_args: ''
          - name: macOS arm64
            os: macos-15
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-rust.ps1 -SkipVerify

      - name: Install the pinned Rust toolchain (macOS)
        if: runner.os != 'Windows'
        run: sh scripts/setup-rust.sh --skip-verify

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> ../build/native-rust/rust-target

      - name: Cache verified native source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-rust/archives
          key: native-archives-${{ hashFiles('native/dependencies.lock.json') }}

      # Core-only configuration: the tests need garak_core (the Rust engine's shell), not devices, ASIO or VST3.
      # CMake builds garak-ffi with cargo and picks the Rust target from the compiler (MSVC ->
      # x86_64-pc-windows-msvc, AppleClang arm64 -> aarch64-apple-darwin).
      - name: Configure the native core
        run: >
          cmake -S native -B build/native-rust -DCMAKE_BUILD_TYPE=Release
          -DGARAK_ENABLE_DEVICES=OFF -DGARAK_ENABLE_ASIO=OFF -DGARAK_ENABLE_VST3=OFF
          ${{ matrix.cmake_args }}

      - name: Build garak-ffi, the engine test and the golden-reference tests
        run: >
          cmake --build build/native-rust --config Release --parallel 4
          --target garak-rust-parity-test garak-engine-test garak-rust-instrument-test
          garak-rust-engine-parity-test garak-rust-engine-host-test
          garak-rust-engine-instrument-parity-test garak-wavetable-host-test garak-rust-wave-golden-test

      # The golden references (native/tests/golden, docs/RUST_ENGINE.md 7) are the 0.3.2 C++ track path's renders:
      # bit-identical on Windows x64 (MSVC here), residual <= -90 dBFS on macOS arm64.
      # Every effect kernel and the guitar rig (param sweeps, automation, tempo, resets, hand-overs, other
      # sample rates), with latency / tail / meters as recorded.
      - name: Run the Rust kernel test (vs golden)
        run: ctest --test-dir build/native-rust -C Release -R native-rust-parity --output-on-failure

      # Render engine (docs/RUST_ENGINE.md): offline exports at several blocks/rates and live diffs, guitar rig.
      - name: Run the render-engine parity test (vs golden)
        run: ctest --test-dir build/native-rust -C Release -R native-rust-engine-parity --output-on-failure

      # Built-in instruments (synths, drums, sample instruments, 옥구슬 EP / 한밤 106, IEUM WAVE): offline exports
      # and a live engine with edits, seeks, cycle wraps and live MIDI.
      - name: Run the render-engine instrument parity test (vs golden)
        run: ctest --test-dir build/native-rust -C Release -R native-rust-engine-instruments --output-on-failure

      # IEUM WAVE, rendered only by the Rust engine since 0.3.3 (docs/IEUM_WAVE.md): against golden renders of the
      # removed C++ synth (bit-identical on Windows x86-64, <= -90 dBFS elsewhere), and through RenderEngine as the
      # shell (onsets, partitions, live/audition notes, held-note patches, table crossfades, validation, allocations).
      - name: Run the IEUM WAVE golden and host tests
        run: ctest --test-dir build/native-rust -C Release -R "native-rust-wave-golden|native-wavetable-host" --output-on-failure

      # 옥구슬 EP / 한밤 106 through garak-ffi: checksum parity with the WASM build (parity.golden),
      # 8 voices < 3 % of one core at 48 kHz, and engine use (timeline, live pedal, edits).
      - name: Run the vintage instrument test (parity, CPU budget, engine)
        run: ctest --test-dir build/native-rust -C Release -R native-rust-instruments --output-on-failure

      # RenderEngine, the shell around the Rust graph (docs/RUST_ENGINE.md 10): offline, live diffs/seek/cycle/master,
      # host nodes, render-ahead, metronome and count-in vs golden; multi-core bit-identity.
      - name: Run the Rust engine host test
        run: ctest --test-dir build/native-rust -C Release -R native-rust-engine-host --output-on-failure

      # The whole engine regression suite (every case renders through the Rust engine).
      - name: Engine tests
        run: ctest --test-dir build/native-rust -C Release -R native-engine --output-on-failure

      - name: Golden-reference tables and CPU
        shell: bash
        run: |
          dir=build/native-rust
          [ -d "$dir/Release" ] && dir="$dir/Release"
          {
            echo "### Rust kernels vs golden (${{ matrix.name }})"
            "$dir/garak-rust-parity-test" | grep '^|'
            echo
            echo "### Render engine vs golden (${{ matrix.name }})"
            "$dir/garak-rust-engine-parity-test" | grep '^|'
            echo
            echo "### Rust engine host path (${{ matrix.name }})"
            "$dir/garak-rust-engine-host-test" --bench | grep '^|'
            echo
            echo "### Render engine instrument parity (${{ matrix.name }})"
            "$dir/garak-rust-engine-instrument-parity-test" | grep -E '^\||^Live edits'
            echo
            echo "### Render engine CPU, instrument-heavy project (${{ matrix.name }})"
            "$dir/garak-rust-engine-instrument-parity-test" bench 10 3 128
            echo
            echo "### Vintage instruments (${{ matrix.name }})"
            "$dir/garak-rust-instrument-test" | grep '^|'
          } | tee -a "$GITHUB_STEP_SUMMARY"
