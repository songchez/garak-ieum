name: Rust core

# The Rust DSP core (docs/RUST.md) and render engine (docs/RUST_ENGINE.md): lint, unit tests, the
# WASM modules (+ size report, the TypeScript parity test and the engine's WASM-vs-native test) on
# Linux, and the garak-ffi staticlib linked into the C++ kernel and engine parity tests with the
# real CI toolchains (Windows MSVC, macOS arm64). Web-only and other native PRs never run this.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rust.yml'
      - 'rust/**'
      - 'native/CMakeLists.txt'
      - 'native/cmake/**'
      - 'native/include/garak/dsp.hpp'
      - 'native/src/dsp.cpp'
      - 'native/src/sigimsae_effects.inc'
      - 'native/src/eq_effects.inc'
      - 'native/src/rust_effects.inc'
      - 'native/tests/rust_bench.cpp'
      - 'native/tests/engine_test.cpp'
      - 'native/tests/rust_parity_test.cpp'
      - 'native/tests/rust_engine_parity_test.cpp'
      - 'native/tests/rust_engine_bench.cpp'
      - 'native/src/engine.cpp'
      - 'native/src/protocol.hpp'
      - 'native/include/garak/engine.hpp'
      - 'native/include/garak/tempo.hpp'
      - 'native/tests/rust_instrument_test.cpp'
      - 'native/src/rust_instrument.hpp'
      - 'src/devices/vintage/**'
      - 'src/audio/rust/**'
      - 'src/audio/native/timeline.ts'
      - 'src/audio/native/timelineSync.ts'
      - 'src/devices/effects/kernels.ts'
      - 'src/devices/effects/sigimsae.ts'
      - 'src/devices/effects/sigimsae.worklet.ts'
      - 'src/devices/effects/sigimsaeDefs.ts'
      - 'src/devices/effects/eqModel.ts'
      - 'scripts/rust.mjs'
      - 'scripts/setup-rust.*'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  core:
    name: Lint, test and WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same one-command setup contributors use; installs the toolchain pinned in
      # rust/rust-toolchain.toml (rustup is preinstalled on GitHub runners).
      - name: Install the pinned Rust toolchain
        run: sh scripts/setup-rust.sh --skip-verify

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy (host and wasm32, warnings are errors)
        working-directory: rust
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p garak-dsp -p garak-wasm -p garak-engine -p garak-engine-wasm --target wasm32-unknown-unknown -- -D warnings

      # Also writes the engine parity project and its native render to rust/target/engine-parity/.
      - name: Unit tests
        working-directory: rust
        run: cargo test --locked --workspace

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # garak-dsp.wasm (effect/instrument worklets) and garak-engine.wasm (the render engine for the
      # web worklet and export worker, docs/RUST_ENGINE.md 5). scripts/rust.mjs writes both size
      # reports to the step summary and fails above either budget.
      - name: Build the WASM modules (fail above their size budgets)
        run: node scripts/rust.mjs wasm

      - name: Upload the WASM modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-dsp-wasm
          path: |
            public/wasm/garak-dsp.wasm
            public/wasm/garak-engine.wasm
          if-no-files-found: error
          retention-days: 14

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Kernel parity (WASM vs TS), the render engine (WASM vs the native Rust render) and the web
      # engine path A/B (Project -> timeline compiler -> garak-engine.wasm vs the Web Audio semantics).
      - name: TypeScript parity against the built WASM modules
        run: pnpm exec vitest run src/audio/rust

  native-parity:
    name: C++ parity (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-latest
            cmake_args: ''
          - name: macOS arm64
            os: macos-15
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-rust.ps1 -SkipVerify

      - name: Install the pinned Rust toolchain (macOS)
        if: runner.os != 'Windows'
        run: sh scripts/setup-rust.sh --skip-verify

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> ../build/native-rust/rust-target

      - name: Cache verified native source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-rust/archives
          key: native-archives-${{ hashFiles('native/dependencies.lock.json') }}

      # Core-only configuration: the parity test needs garak_core, not devices, ASIO or VST3.
      # CMake picks the Rust target from the compiler (MSVC -> x86_64-pc-windows-msvc,
      # AppleClang arm64 -> aarch64-apple-darwin).
      - name: Configure with GARAK_RUST=ON
        run: >
          cmake -S native -B build/native-rust -DCMAKE_BUILD_TYPE=Release
          -DGARAK_RUST=ON -DGARAK_ENABLE_DEVICES=OFF -DGARAK_ENABLE_ASIO=OFF -DGARAK_ENABLE_VST3=OFF
          ${{ matrix.cmake_args }}

      - name: Build garak-ffi, the parity tests, the benchmarks and the engine test
        run: >
          cmake --build build/native-rust --config Release --parallel 4
          --target garak-rust-parity-test garak-rust-bench garak-engine-test garak-rust-instrument-test
          garak-rust-engine-parity-test garak-rust-engine-bench

      # Every ported effect through C++ and Rust (param sweeps, automation, tempo, resets,
      # hand-overs, other sample rates): residual <= -90 dBFS, identical latency / tail / meters.
      - name: Run the Rust vs C++ parity test
        run: ctest --test-dir build/native-rust -C Release -R native-rust-parity --output-on-failure

      # Render engine (docs/RUST_ENGINE.md): the same project through the C++ RenderEngine and
      # rust/garak-engine (offline exports at several blocks/rates, live diffs): residual <= -90 dBFS.
      - name: Run the render-engine parity test (C++ vs Rust engine)
        run: ctest --test-dir build/native-rust -C Release -R native-rust-engine-parity --output-on-failure

      # 옥구슬 EP / 한밤 106 through garak-ffi: checksum parity with the WASM build (parity.golden),
      # 8 voices < 3 % of one core at 48 kHz, and engine use (timeline, live pedal, edits).
      - name: Run the vintage instrument test (parity, CPU budget, engine)
        run: ctest --test-dir build/native-rust -C Release -R native-rust-instruments --output-on-failure

      # The whole engine regression suite with every built-in effect switched to Rust.
      - name: Engine tests with the Rust effects (GARAK_RUST_EFFECTS=all)
        env:
          GARAK_RUST_EFFECTS: all
        run: ctest --test-dir build/native-rust -C Release -R native-engine --output-on-failure

      - name: Parity table and CPU baseline (C++ vs Rust)
        shell: bash
        run: |
          dir=build/native-rust
          [ -d "$dir/Release" ] && dir="$dir/Release"
          {
            echo "### Rust vs C++ parity (${{ matrix.name }})"
            "$dir/garak-rust-parity-test" | grep '^|'
            echo
            echo "### CPU baseline (${{ matrix.name }})"
            "$dir/garak-rust-bench" 3
            echo
            echo "### Render engine parity (${{ matrix.name }})"
            "$dir/garak-rust-engine-parity-test" | grep '^|'
            echo
            echo "### Render engine CPU, 16/32 tracks (${{ matrix.name }})"
            "$dir/garak-rust-engine-bench" 10 3 128
            echo
            echo "### Vintage instruments (${{ matrix.name }})"
            "$dir/garak-rust-instrument-test" | grep '^|'
          } | tee -a "$GITHUB_STEP_SUMMARY"
