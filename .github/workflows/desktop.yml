name: Windows desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_build:
        description: Preserve this exact release build while other commits run.
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'native/**'
      - 'scripts/native-*.mjs'
      - 'scripts/build-native-audio.mjs'
      - 'scripts/desktop-*.mjs'
      - 'scripts/desktop-*.ps1'
      - 'scripts/build-mcp-launcher.*'
      - 'scripts/prepare-licenses.mjs'
      - 'scripts/source-info.mjs'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'build/installer.nsh'
      - 'src/**'
      - 'public/**'
      - 'mcp/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'electron-builder.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'native/**'
      - 'scripts/native-*.mjs'
      - 'scripts/build-native-audio.mjs'
      - 'scripts/desktop-*.mjs'
      - 'scripts/desktop-*.ps1'
      - 'scripts/build-mcp-launcher.*'
      - 'scripts/prepare-licenses.mjs'
      - 'scripts/source-info.mjs'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'build/installer.nsh'
      - 'src/**'
      - 'public/**'
      - 'mcp/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'electron-builder.*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_build && github.run_id || 'validation' }}
  cancel-in-progress: ${{ !inputs.release_build }}

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Validation builds reuse the native host when native sources, its build scripts and CMake
      # are unchanged (most pushes only touch src/). Release builds always compile from scratch.
      - name: Restore unchanged native engine build
        if: ${{ !inputs.release_build }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/native-audio
            build/native-work
          key: native-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'scripts/build-native-audio.mjs', 'scripts/native-dependencies.mjs') }}

      - name: Build Windows installer
        env:
          GARAK_NATIVE_REUSE: ${{ inputs.release_build && '0' || '1' }}
        run: |
          # Validation installers skip LZMA so packaging is fast; the installed app is identical.
          # Release installers keep the configured normal compression.
          if ('${{ inputs.release_build }}' -eq 'true') { pnpm desktop:build } else { pnpm desktop:build -c.compression=store }

      - name: Verify native audio and actual VST3 host
        run: pnpm native:test

      - name: Install and verify .garak file association
        run: ./scripts/desktop-install-smoke.ps1

      - name: Smoke-test installed desktop app
        run: pnpm desktop:test

      - name: Upload desktop smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-ieum-desktop-smoke-${{ github.sha }}
          path: release/desktop-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package matching project source
        run: pnpm desktop:source

      - name: Calculate installer and source checksums
        run: |
          $desktopInstallers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File | Sort-Object Name)
          if ($desktopInstallers.Count -eq 0) {
            throw 'The Windows installer was not produced.'
          }
          $desktopSources = @(Get-ChildItem -LiteralPath release -Filter 'Garak-Ieum-Source-*.zip' -File | Sort-Object Name)
          if ($desktopSources.Count -ne 1) {
            throw 'Exactly one matching project source archive is required.'
          }
          $desktopChecksums = @($desktopInstallers) + @($desktopSources) | ForEach-Object {
            $desktopHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $desktopHash, $_.Name
          }
          $desktopChecksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload tested installer and matching source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-ieum-windows-x64-${{ github.sha }}
          path: |
            release/*.exe
            release/Garak-Ieum-Source-*.zip
            release/SOURCE.txt
            release/LICENSE.txt
            release/THIRD_PARTY_NOTICES.txt
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
