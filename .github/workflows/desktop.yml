name: Windows desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'scripts/desktop-*.mjs'
      - 'scripts/desktop-*.ps1'
      - 'build/installer.nsh'
      - 'src/**'
      - 'public/**'
      - 'mcp/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'electron-builder.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'scripts/desktop-*.mjs'
      - 'scripts/desktop-*.ps1'
      - 'build/installer.nsh'
      - 'src/**'
      - 'public/**'
      - 'mcp/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'electron-builder.*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm desktop:build

      - name: Install and verify .garak file association
        run: ./scripts/desktop-install-smoke.ps1

      - name: Smoke-test installed desktop app
        run: pnpm desktop:test

      - name: Upload desktop smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-ieum-desktop-smoke-${{ github.sha }}
          path: release/desktop-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Calculate installer checksums
        run: |
          $desktopInstallers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File | Sort-Object Name)
          if ($desktopInstallers.Count -eq 0) {
            throw 'The Windows installer was not produced.'
          }
          $desktopChecksums = $desktopInstallers | ForEach-Object {
            $desktopHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $desktopHash, $_.Name
          }
          $desktopChecksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload tested installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garak-ieum-windows-x64-${{ github.sha }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
