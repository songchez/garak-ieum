name: Checks

# Fast pull-request gate for every change: unit tests, type checks and the web,
# MCP and desktop TypeScript builds on Linux (about a minute). Installer builds
# and installed-app smoke tests run in the Windows/macOS workflows for desktop,
# native and packaging changes, and always before a public release.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'releases/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check and build the app
        run: pnpm build

      - name: Build the MCP server and desktop main process
        run: pnpm mcp:build && pnpm desktop:compile

      - name: Check committed release settings
        run: pnpm release:check
