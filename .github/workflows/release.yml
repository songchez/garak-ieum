name: Public desktop release

on:
  push:
    branches: [main]
    paths:
      - 'release.config.json'
      - 'releases/**'
      - 'scripts/release-*.mjs'
      - 'scripts/desktop-source.mjs'
      - 'scripts/source-info.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/macos.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'release.config.json'
      - 'releases/**'
      - 'scripts/release-*.mjs'
      - 'scripts/desktop-source.mjs'
      - 'scripts/source-info.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/macos.yml'
      - 'package.json'

permissions:
  contents: read

# Distinct release commits are not canceled or displaced by a newer commit.
# Publishing the same version is separately serialized below.
concurrency:
  group: public-desktop-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate committed release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out exact source and previous push commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release safeguards
        run: node --test scripts/release-tests.mjs
      - name: Read the committed release request
        id: plan
        run: node scripts/release-config.mjs plan

  windows:
    name: Verify Windows installer
    needs: plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'songchez/garak-ieum' && needs.plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/desktop.yml
    with:
      release_build: true
    permissions:
      contents: read

  macos:
    name: Verify Apple Silicon installer
    needs: plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'songchez/garak-ieum' && needs.plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/macos.yml
    with:
      release_build: true
    permissions:
      contents: read

  publish:
    name: Publish both verified installers together
    needs: [plan, windows, macos]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'songchez/garak-ieum' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: public-desktop-release-version-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out the exact source being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download Windows artifact from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: garak-ieum-windows-x64-${{ github.sha }}
          path: release/incoming/windows
      - name: Download macOS artifact from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: garak-ieum-macos-arm64-${{ github.sha }}
          path: release/incoming/macos
      - name: Validate, upload privately, verify and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs --publish
